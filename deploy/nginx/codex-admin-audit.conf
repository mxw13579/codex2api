# At http scope (e.g. conf.d/codex-admin-audit.conf).
# $uri excludes query strings; keep credentials out of the log. The application
# separately records sanitized User-Agent and Referer for admin audit events.
log_format codex_audit escape=json
    '{"time":"$time_iso8601","client_ip":"$remote_addr",'
    '"peer_ip":"$realip_remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri",'
    '"status":$status,"request_id":"$request_id",'
    '"cf_ray":"$http_cf_ray"}';

map $uri $codex_admin_audit {
    default 0;
    ~^/api/admin/ 1;
}

